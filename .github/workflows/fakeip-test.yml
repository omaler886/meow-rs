name: FakeIP stable and alpha

on:
  workflow_dispatch:
  push:
    branches: [main, 'fakeip/**']
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'tests/test_fakeip_filter_binary.py'
      - '.github/workflows/fakeip-test.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'tests/test_fakeip_filter_binary.py'
      - '.github/workflows/fakeip-test.yml'

permissions:
  contents: read

concurrency:
  group: fakeip-binary-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev pkg-config
      - name: Formatting and strict Clippy feature matrix
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --no-default-features -- -D warnings
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo clippy --locked -p meow-common --all-targets -- -D warnings
      - name: DNS, config, routing, reload and offline regressions
        run: |
          cargo test --locked -p meow-dns --lib --tests
          cargo test --locked -p meow-config --lib --test fakeip_filter_rules --test dns_response_rules --test config_test
          cargo test --locked -p meow-app --test offline_config_test
          cargo test --locked -p meow-rules --lib --test rules_test
          cargo test --locked -p meow-tunnel --test fakeip_test
          cargo test --locked -p meow-api --test api_test
          cargo test --locked --workspace --lib
          cargo test --locked -p meow-listener --all-features --lib udp_port_53
          cargo test --locked -p meow-dns --features quic-dns --test quic_dns_integration
          cargo test --locked -p meow-common --lib -- logbook traffic_ledger
      - name: Minimal compilation and strict rustdoc
        run: |
          cargo check --locked -p meow-app --no-default-features --features minimal --bin meow
          RUSTDOCFLAGS=-Dwarnings cargo doc --locked --workspace --no-deps
  binary-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev pkg-config
      - name: Test FakeIP configuration and DNS regressions
        run: |
          cargo test --locked -p meow-config --test fakeip_filter_rules --test dns_response_rules
          cargo test --locked -p meow-app --test offline_config_test
      - name: Build and test stable release binary
        env:
          MEOW_VERSION_SUFFIX: ''
        run: |
          set -euo pipefail
          mkdir -p dist
          cargo build --locked --release -p meow-app --bin meow
          cp target/release/meow dist/meow-stable-linux-x86_64
          python3 tests/test_fakeip_filter_binary.py dist/meow-stable-linux-x86_64 --flavor stable --output dist/stable-results.json | tee dist/stable-test.log
      - name: Build and test alpha release binary
        run: |
          set -euo pipefail
          export MEOW_VERSION_SUFFIX="-alpha+$(git rev-parse --short=7 HEAD)"
          cargo build --locked --release -p meow-app --bin meow
          cp target/release/meow dist/meow-alpha-linux-x86_64
          python3 tests/test_fakeip_filter_binary.py dist/meow-alpha-linux-x86_64 --flavor alpha --output dist/alpha-results.json | tee dist/alpha-test.log
          cd dist
          sha256sum meow-*-linux-x86_64 > SHA256SUMS
      - name: Upload binaries and regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fakeip-stable-alpha-linux-x86_64-${{ github.sha }}
          path: dist/
          if-no-files-found: warn
          retention-days: 14
